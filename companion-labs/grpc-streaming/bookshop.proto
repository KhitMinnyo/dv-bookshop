syntax = "proto3";

package companion.grpc;

service BookStream {
  rpc WatchBooks(WatchRequest) returns (stream BookEvent);
  rpc UploadBooks(stream BookUpload) returns (UploadSummary);
  rpc Chat(stream ChatMessage) returns (stream ChatMessage);
}

message WatchRequest {
  string owner = 1;
}

message BookEvent {
  string owner = 1;
  uint32 sequence = 2;
  string title = 3;
}

message BookUpload {
  string owner = 1;
  string title = 2;
}

message UploadSummary {
  string owner = 1;
  uint32 accepted = 2;
}

message ChatMessage {
  string owner = 1;
  string text = 2;
  uint32 sequence = 3;
}
