apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-vulnerable
  labels:
    app.kubernetes.io/name: companion-vulnerable
automountServiceAccountToken: true
---
apiVersion: v1
kind: Secret
metadata:
  name: lab-dummy-secret
  labels:
    app.kubernetes.io/name: companion-vulnerable
type: Opaque
stringData:
  password: demo-only-password
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab-vulnerable-role
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-vulnerable-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lab-vulnerable-role
subjects:
  - kind: ServiceAccount
    name: lab-vulnerable
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-vulnerable
  labels:
    app.kubernetes.io/name: companion-vulnerable
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: companion-vulnerable
  template:
    metadata:
      labels:
        app.kubernetes.io/name: companion-vulnerable
    spec:
      serviceAccountName: lab-vulnerable
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          env:
            - name: DEMO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lab-dummy-secret
                  key: password
          securityContext:
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
---
apiVersion: v1
kind: Service
metadata:
  name: lab-vulnerable
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: companion-vulnerable
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lab-vulnerable
spec:
  ingressClassName: nginx
  rules:
    - host: bookshop.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lab-vulnerable
                port:
                  name: http
