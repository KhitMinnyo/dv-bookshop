apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-hardened
  labels:
    app.kubernetes.io/name: companion-hardened
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: lab-dummy-secret
  labels:
    app.kubernetes.io/name: companion-hardened
type: Opaque
stringData:
  password: demo-only-password
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab-hardened-role
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["lab-settings"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-hardened-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lab-hardened-role
subjects:
  - kind: ServiceAccount
    name: lab-hardened
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-settings
data:
  mode: local-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-hardened
  labels:
    app.kubernetes.io/name: companion-hardened
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: companion-hardened
  template:
    metadata:
      labels:
        app.kubernetes.io/name: companion-hardened
    spec:
      serviceAccountName: lab-hardened
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DEMO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lab-dummy-secret
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lab-hardened
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: companion-hardened
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lab-hardened-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: companion-hardened
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lab-hardened-allow-local-and-dns
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: companion-hardened
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lab-hardened
spec:
  ingressClassName: nginx
  rules:
    - host: bookshop.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lab-hardened
                port:
                  name: http
