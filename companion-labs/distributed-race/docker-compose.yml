services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: race_lab
      POSTGRES_USER: race_lab
      POSTGRES_PASSWORD: race_lab_demo_password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U race_lab -d race_lab"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
  worker:
    build: .
    environment:
      DATABASE_URL: postgresql://race_lab:race_lab_demo_password@db:5432/race_lab
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
