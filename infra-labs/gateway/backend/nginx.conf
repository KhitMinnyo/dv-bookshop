events {}

http {
    server {
        listen 8080;
        server_name _;

        location = /healthz {
            default_type text/plain;
            return 200 "backend ok\n";
        }

        location / {
            default_type text/plain;
            add_header Cache-Control "public, max-age=30" always;
            add_header ETag "\"lab-backend-v1\"" always;
            add_header Vary "Accept-Encoding" always;
            return 200 "DV-Bookshop infrastructure lab placeholder origin\n";
        }
    }
}
