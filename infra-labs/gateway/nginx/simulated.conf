# Simulated fallback: this serves canned local responses and has no upstream.
events {}

http {
    server {
        listen 8080;
        server_name _;
        merge_slashes on;
        client_max_body_size 1m;

        location = /healthz {
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            return 200 "simulated gateway ok\n";
        }

        location / {
            default_type text/plain;
            add_header Cache-Control "public, max-age=15" always;
            add_header ETag "\"simulated-v1\"" always;
            add_header Vary "Accept-Encoding" always;
            return 200 "simulated local origin response\n";
        }
    }
}
