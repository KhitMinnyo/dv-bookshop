events {}

http {
    # Nginx normalizes repeated slashes before location matching and proxying.
    merge_slashes on;
    client_max_body_size 1m;
    limit_req_zone $binary_remote_addr zone=api_rate:10m rate=10r/s;

    upstream cache_origin {
        server cache:6081;
    }

    server {
        listen 8080;
        server_name _;

        location = /healthz {
            default_type text/plain;
            return 200 "gateway ok\n";
        }

        # Keep personalized data out of the cache even if the origin makes a mistake.
        location ^~ /account {
            add_header Cache-Control "private, no-store" always;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            proxy_pass http://cache_origin;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location / {
            # Small edge controls stand in for a deliberately narrow WAF policy.
            limit_req zone=api_rate burst=20 nodelay;
            limit_except GET HEAD POST { deny all; }
            proxy_pass http://cache_origin;
            proxy_set_header Host $host;

            # Overwrite, rather than append to, client-controlled forwarding headers.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
        }
    }
}
